openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: SuperLive Outreach Bot API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: campaigns
    description: Outreach campaign management
  - name: streamers
    description: Streamer discovery and tracking
  - name: logs
    description: Outreach activity logs
  - name: templates
    description: Message template management
  - name: stats
    description: Dashboard statistics
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /campaigns:
    get:
      operationId: listCampaigns
      tags: [campaigns]
      summary: List all campaigns
      responses:
        "200":
          description: List of campaigns
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Campaign"
    post:
      operationId: createCampaign
      tags: [campaigns]
      summary: Create a campaign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"

  /campaigns/{id}:
    get:
      operationId: getCampaign
      tags: [campaigns]
      summary: Get a campaign by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "404":
          description: Not found
    patch:
      operationId: updateCampaign
      tags: [campaigns]
      summary: Update a campaign
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
    delete:
      operationId: deleteCampaign
      tags: [campaigns]
      summary: Delete a campaign
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /campaigns/{id}/start:
    post:
      operationId: startCampaign
      tags: [campaigns]
      summary: Start a campaign bot
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Campaign started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"

  /campaigns/{id}/stop:
    post:
      operationId: stopCampaign
      tags: [campaigns]
      summary: Stop a campaign bot
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Campaign stopped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"

  /templates:
    get:
      operationId: listTemplates
      tags: [templates]
      summary: List message templates
      responses:
        "200":
          description: List of templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MessageTemplate"
    post:
      operationId: createTemplate
      tags: [templates]
      summary: Create a message template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageTemplateInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageTemplate"

  /templates/{id}:
    patch:
      operationId: updateTemplate
      tags: [templates]
      summary: Update a message template
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageTemplateUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageTemplate"
    delete:
      operationId: deleteTemplate
      tags: [templates]
      summary: Delete a message template
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /streamers:
    get:
      operationId: listStreamers
      tags: [streamers]
      summary: List discovered streamers
      parameters:
        - name: platform
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of streamers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Streamer"

  /logs:
    get:
      operationId: listLogs
      tags: [logs]
      summary: List outreach activity logs
      parameters:
        - name: campaignId
          in: query
          required: false
          schema:
            type: integer
        - name: platform
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OutreachLog"

  /stats:
    get:
      operationId: getStats
      tags: [stats]
      summary: Get dashboard statistics
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stats"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Campaign:
      type: object
      required: [id, name, platform, status, messageTemplateId, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        platform:
          type: string
          description: "stripchat | tango | xenalive"
        status:
          type: string
          description: "idle | running | paused | completed"
        messageTemplateId:
          type: ["integer", "null"]
        minViewers:
          type: ["integer", "null"]
        maxViewers:
          type: ["integer", "null"]
        category:
          type: ["string", "null"]
        messagesPerHour:
          type: integer
        totalMessagesSent:
          type: integer
        totalResponses:
          type: integer
        credentials:
          type: ["string", "null"]
          description: "JSON encoded platform credentials"
        notes:
          type: ["string", "null"]
        createdAt:
          type: string

    CampaignInput:
      type: object
      required: [name, platform]
      properties:
        name:
          type: string
        platform:
          type: string
        messageTemplateId:
          type: ["integer", "null"]
        minViewers:
          type: ["integer", "null"]
        maxViewers:
          type: ["integer", "null"]
        category:
          type: ["string", "null"]
        messagesPerHour:
          type: integer
        credentials:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]

    CampaignUpdate:
      type: object
      properties:
        name:
          type: string
        platform:
          type: string
        messageTemplateId:
          type: ["integer", "null"]
        minViewers:
          type: ["integer", "null"]
        maxViewers:
          type: ["integer", "null"]
        category:
          type: ["string", "null"]
        messagesPerHour:
          type: integer
        credentials:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]

    MessageTemplate:
      type: object
      required: [id, name, content, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        content:
          type: string
          description: "Template text. Use {streamer_name} as placeholder"
        platform:
          type: ["string", "null"]
          description: "Optional platform filter"
        createdAt:
          type: string

    MessageTemplateInput:
      type: object
      required: [name, content]
      properties:
        name:
          type: string
        content:
          type: string
        platform:
          type: ["string", "null"]

    MessageTemplateUpdate:
      type: object
      properties:
        name:
          type: string
        content:
          type: string
        platform:
          type: ["string", "null"]

    Streamer:
      type: object
      required: [id, username, platform, createdAt]
      properties:
        id:
          type: integer
        username:
          type: string
        platform:
          type: string
        displayName:
          type: ["string", "null"]
        viewers:
          type: ["integer", "null"]
        category:
          type: ["string", "null"]
        profileUrl:
          type: ["string", "null"]
        status:
          type: string
          description: "pending | contacted | responded | joined | ignored"
        lastContactedAt:
          type: ["string", "null"]
        createdAt:
          type: string

    OutreachLog:
      type: object
      required: [id, campaignId, platform, streamerUsername, messageSent, createdAt]
      properties:
        id:
          type: integer
        campaignId:
          type: integer
        campaignName:
          type: ["string", "null"]
        platform:
          type: string
        streamerUsername:
          type: string
        messageSent:
          type: string
        status:
          type: string
          description: "sent | failed | responded"
        responseText:
          type: ["string", "null"]
        createdAt:
          type: string

    Stats:
      type: object
      required: [totalCampaigns, activeCampaigns, totalMessagesSent, totalResponses, totalStreamersContacted, responseRate, platformBreakdown, recentActivity]
      properties:
        totalCampaigns:
          type: integer
        activeCampaigns:
          type: integer
        totalMessagesSent:
          type: integer
        totalResponses:
          type: integer
        totalStreamersContacted:
          type: integer
        responseRate:
          type: number
        platformBreakdown:
          type: array
          items:
            type: object
            required: [platform, messagesSent, responses]
            properties:
              platform:
                type: string
              messagesSent:
                type: integer
              responses:
                type: integer
        recentActivity:
          type: array
          items:
            $ref: "#/components/schemas/OutreachLog"
